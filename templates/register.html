{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block auth %}
<div class="auth-container">
  <div class="auth-card">
    <h2><i class="bi bi-person-plus-fill me-2"></i>Register</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required minlength="4">
      </div>
      <div class="mb-3">
        <label class="form-label">Role</label>
        <select name="role" class="form-select" required>
          <option value="student">Student</option>
          <option value="examiner">Examiner</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Department</label>
        <input type="text" name="department" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Contact</label>
        <input type="text" name="contact" class="form-control">
      </div>
      <button class="btn btn-primary w-100 mb-3">Register</button>
    </form>
    <p class="text-center mb-0">Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
  </div>
</div>
{% endblock %}
