{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block auth %}
<div class="auth-container">
  <div class="auth-card">
    <h2><i class="bi bi-mortarboard-fill me-2"></i>EMP Login</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button class="btn btn-primary w-100 mb-3">Log In</button>
    </form>
    <p class="text-center mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
  </div>
</div>
{% endblock %}
